<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title> DRAMA PHIM - Phim ngắn Hoa Ngữ</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  background: #181818;
  padding: 22px 16px;
  border-bottom: 1px solid #292929;
}

.logo {
  color: #ffc928;
  font-size: 30px;
  font-weight: bold;
}

.subtitle {
  color: #aaa;
  margin-top: 8px;
  font-size: 15px;
}

.search {
  width: 100%;
  margin-top: 18px;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #292929;
  color: white;
  font-size: 16px;
}

.container {
  padding: 25px 16px;
  max-width: 1000px;
  margin: auto;
}

.title {
  font-size: 28px;
  margin-bottom: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
}

.card {
  background: #1e1e1e;
  border-radius: 14px;
  overflow: hidden;
}

.card img {
  width: 100%;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  display: block;
}

.info {
  padding: 14px;
}

.name {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 8px;
}

.meta {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 14px;
}

.button {
  display: inline-block;
  background: #ffc928;
  color: #111;
  text-decoration: none;
  font-weight: bold;
  padding: 12px 18px;
  border-radius: 10px;
}

footer {
  text-align: center;
  color: #777;
  padding: 35px 15px;
}

@media (max-width: 600px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .name {
    font-size: 16px;
  }

  .button {
    padding: 10px 12px;
    font-size: 14px;
  }
}
</style></head><body><header><div class="logo">DRAMA PHIM</div><div class="subtitle"> Phim ngắn Hoa Ngữ • Xem phim được phép sử dụng </div><input
    class="search"
    id="search"
    type="text"
    placeholder="🔍 Tìm tên phim..."
    oninput="searchMovie()"
  ></header><div class="container"><div class="title"> 🔥 Phim mới </div><div class="grid" id="movieList"><div class="card" data-name="sự nhầm lẫn tai hại"><img
        src="poster-su-nham-lan-tai-hai.png"
        alt="Sự Nhầm Lẫn Tai Hại"
      ><div class="info"><div class="name"> Sự Nhầm Lẫn Tai Hại</div><div class="meta"> Phim ngắn Hoa Ngữ • Full</div> <a
          class="button"
          href="su-nham-lan-tai-hai.html"
        >Xem phim</a></div></div></div></div><footer> © 2026 DRAMA PHIM</footer><script>
function searchMovie() {
  const keyword =
    document.getElementById("search").value.toLowerCase();

  const movies =
    document.querySelectorAll(".card");

  movies.forEach(movie => {
    const name =
      movie.getAttribute("data-name");

    if (name.includes(keyword)) {
movie.style.display = "";
    } else {
      movie.style.display = "none";
    }
  });
}
</script></body></html>
